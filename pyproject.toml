[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventlab"
version = "0.1.0"
description = "A small toolkit to build event catalogs and DTDs from COSMIC output"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]